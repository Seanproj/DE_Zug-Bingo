  sheet.verify_auto: 실시간 데이터로 자동 인증 가능 · 점수 ×{mult} (곧 지원)
  sheet.verify_self: 셀프 신고 칸 · 점수 ×{mult}
  sheet.points: '{points}점'
  sheet.check: 체크하기
  sheet.uncheck: 체크 해제
