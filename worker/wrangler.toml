# Cloudflare Worker — DB Timetables proxy for Zug-Bingo.
# Secrets (never commit): npx wrangler secret put DB_CLIENT_ID / DB_API_KEY
# Local dev: copy .dev.vars.example → .dev.vars (git-ignored), then `npx wrangler dev`.
name = "zug-bingo-proxy"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# Comma-separated list of app origins allowed to call the proxy. "*" while developing.
ALLOWED_ORIGIN = "*"
