# 칸 풀. 문구 규칙은 CLAUDE.md §6 톤 가이드 참고 — 시스템을 풍자, 사람은 탓하지 않는다.
#
# 필드
#   id          고유 id (snake_case). 저장 데이터의 키이므로 한 번 배포하면 바꾸지 않는다.
#   term        독일어 원어 (실제 안내/전광판 용어). ko/en UI에서 병기한다.
#   (표시 문구 label/short/flavor는 config/locales/{ko,en,de}.yaml 의 squares.<id>)
#   emoji       칸 아이콘
#   rarity      rarity.yaml의 id
#   verifiable  true = 실시간 데이터로 자동 인증 가능 (×1.5), false = 셀프 신고 (×1.0)
#   verify      (verifiable일 때) Phase 3 자동 인증 규칙 힌트
#   category    delay | cancel | platform | connection | onboard | announcement | network | event | luck
#   implies     이 칸을 체크하면 함께 체크되는 칸 id 목록
#   pools       등장하는 카드 종류 (기본: [daily, trip]). event 전용 칸은 Daily에 안 나온다.
#   probability (선택) 등급 기본 확률 대신 쓸 칸별 발생 확률
#   origin      handoff = HANDOFF 3장 초안 / original = Phase 0 추가 제안

squares:
  # ─────────────── HANDOFF 3장 초안 (23) ───────────────
  - id: delay_5
    term: Verspätung +5
    emoji: "⏱️"
    rarity: common
    verifiable: true
    verify: { type: delay_min, minutes: 5 }
    category: delay
    origin: handoff

  - id: delay_20
    term: Zugbindung aufgehoben
    emoji: "🔓"
    rarity: uncommon
    verifiable: true
    verify: { type: delay_min, minutes: 20 }
    category: delay
    implies: [delay_5]
    origin: handoff

  - id: delay_60
    term: Verspätung +60
    emoji: "💶"
    rarity: rare
    verifiable: true
    verify: { type: delay_min, minutes: 60 }
    category: delay
    implies: [delay_20, delay_5]
    origin: handoff

  - id: delay_120
    term: Verspätung +120
    emoji: "💰"
    rarity: legendary
    verifiable: true
    verify: { type: delay_min, minutes: 120 }
    category: delay
    implies: [delay_60, delay_20, delay_5]
    origin: handoff

