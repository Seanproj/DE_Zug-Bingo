# 희귀도 등급. 순서 = 낮은 등급 → 높은 등급 (tier 값으로 비교).
#
# probability: "평범한 통근자가 오늘 하루 이 칸을 겪을 확률" 기본 추정치.
#   - Bahn-Wetter 확률 JSON이 연결되면(Phase 3) 노선별 값으로 대체된다.
#   - 칸별로 squares.yaml에서 probability를 덮어쓸 수 있다.
#   - 밸런스 리포트(npm run report:balance)가 이 값으로 난이도를 시뮬레이션한다.
#
# share_emoji: Wordle식 텍스트 공유에서 체크된 칸 표시.

rarities:
  - id: common
    tier: 0
    label: Common
    label_ko: 흔함
    emoji: "⚪"
    points: 10
    color: "#9AA4B2"
    glow: "rgba(154,164,178,0.35)"
    share_emoji: "🟩"
    probability: 0.55

  - id: uncommon
    tier: 1
    label: Uncommon
    label_ko: 가끔
    emoji: "🟢"
    points: 25
    color: "#3DDC84"
    glow: "rgba(61,220,132,0.45)"
    share_emoji: "🟨"
    probability: 0.30

  - id: rare
    tier: 2
    label: Rare
    label_ko: 희귀
    emoji: "🔵"
    points: 50
    color: "#3B9EFF"
    glow: "rgba(59,158,255,0.55)"
    share_emoji: "🟦"
    probability: 0.12

  - id: epic
    tier: 3
    label: Epic
    label_ko: 에픽
    emoji: "🟣"
    points: 100
    color: "#A66BFF"
    glow: "rgba(166,107,255,0.6)"
    share_emoji: "🟪"
    probability: 0.05

  - id: legendary
    tier: 4
    label: Legendary
    label_ko: 전설
    emoji: "🟠"
    points: 250
    color: "#FF9F1C"
    glow: "rgba(255,159,28,0.65)"
    share_emoji: "🟧"
    probability: 0.02

  - id: mythic
    tier: 5
    label: Mythic
    label_ko: 신화
    emoji: "🌈"
    points: 500
    color: "#FF6AD5"           # 대표색. UI에서는 아래 gradient 사용
    gradient: ["#FF6AD5", "#FFD36A", "#6AFFB0", "#6AC8FF", "#B06AFF"]
    glow: "rgba(255,106,213,0.7)"
    share_emoji: "🌈"
    probability: 0.01

share:
  unchecked_emoji: "⬜"

# Daily 카드 구성 규칙 (무료 칸 제외 24칸).
daily_card:
  # v0 (7/6/6/3/1/1) 시뮬레이션 결과 하루 1줄 확률 2.3% → 너무 어려움.
  # reports/phase0.md 참고. 현재 값은 축복 라인과 함께 ~20%/일 목표로 튜닝.
  composition:
    common: 9
    uncommon: 6
    rare: 5
    epic: 2
    legendary: 1
    mythic: 1

  # 줄(가로·세로·대각선) 단위 배치 제약.
  # min_tier 이상 등급의 칸은 한 줄에 최대 max 개.
  # → 모든 줄이 "불가능에 가까운 줄"이 되지 않도록, 고등급 칸을 흩어 놓는다.
  line_caps:
    - min_tier: 3              # Epic 이상
      max: 1
    - min_tier: 2              # Rare 이상 (9칸 / 축복 라인 제외 4줄 → 줄당 최대 3)
      max: 3

  # 🫡 축복 라인 (blessed lanes): 무료 칸을 지나는 줄(가로·세로·대각선 4개) 중 count개를
  # 골라, 그 줄의 칸을 max_tier 이하 등급으로만 채운다. "오늘도 탔다" 칸의 가호.
  # → 매일 최소한 '현실적으로 노려볼 만한' 줄이 존재하게 만드는 장치.
  #   UI에서는 이 줄을 은은하게 표시해 첫 목표를 제시한다.
  blessed_lanes:
    count: 2
    max_tier: 0                # Common만
