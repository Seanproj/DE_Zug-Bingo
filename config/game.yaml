# 게임 전역 규칙. 코드에 하드코딩하지 말고 여기서만 바꾼다.

# 지원 언어. 첫 항목이 기준(reference) 언어 — 다른 언어는 같은 키를 모두 가져야 한다.
# 기기 언어가 목록에 없으면 fallback 사용.
locales:
  supported: [ko, en, de]
  reference: ko
  fallback: en

# 카드 생성 알고리즘 버전. RNG/생성 순서/배치 규칙을 바꿔서 같은 날짜의 카드가
# 달라지게 되면 반드시 올린다 (과거 공유 카드와 불일치가 생기기 때문).
generator_version: 2           # v2: 현실 확률 반영으로 칸 등급/풀 변경 + 주간 카드

board:
  size: 5                     # 5×5
  free_square:
    id: free_rode_today
    term: Heute wieder Bahn gefahren
    emoji: "🫡"                # 문구는 locales/*.yaml 의 free_square

# 메인 카드 주기. 현실 확률로 시뮬레이션하니 매일 5×5는 하루 빙고 0.4% → 주간 카드가 메인.
# (reports/balance-weekly.md 참고). 체크는 매일 하고, 같은 주의 체크가 한 카드에 쌓인다.
card:
  period: week                # day | week

daily:
  timezone: Europe/Berlin     # 독일 기준 00시에 날짜가 바뀐다 (주간 카드도 이 시간대의 월요일 00시)
  epoch: "2026-10-23"         # 이 날짜가 Daily #1
  seed_prefix: "daily"

weekly:
  epoch: "2026-10-19"         # 이 주(월요일)가 Zug-Bingo #1
  seed_prefix: "week"
  active_days: 5              # 밸런스 시뮬레이션: 한 주의 통근일 수

scoring:
  # 칸 점수 = round(등급 점수 × 배수)
  verify_multiplier:
    auto: 1.5                 # ✅ 실시간 데이터로 자동 인증
    self: 1.0                 # 🙋 셀프 신고
  free_square_points: 0
  bonus:
    line: 50                  # 빙고 1줄마다
    blackout: 1000            # 25칸 전부

feedback:
  haptic:
    line: [30, 60, 30, 60, 90]          # 빙고 줄 완성
    blackout: [60, 60, 60, 60, 60, 60, 200]

share:
  hashtag: "#ZugBingo"
  url: ""                     # 배포 도메인이 정해지면 채운다 (공유 텍스트 마지막 줄)

# ── Phase 3: 실시간 인증 (Cloudflare Workers 프록시 경유) ──
verify:
  endpoint: "/api"            # 프록시 경로. dev/preview는 vite가 127.0.0.1:8787 로 넘긴다
  timeout_ms: 8000
  # on_time / early_arrival / delay 칸은 실제 도착(변경 시각 또는 계획 시각) 이후에만 확정
  settle_grace_min: 0

# ── 예측 베팅 (게임 포인트 전용 — 실제 돈 없음) ──
# probability: 도착역 기준 지연 구간 추정치 (DB 장거리 정시율 ~60%, 6분 기준).
#   Bahn-Wetter 확률 JSON이 연결되면 노선별 값으로 대체. 배당 = 1 / probability (소수 1자리).
prediction:
  start_points: 100
  daily_bonus: 10             # 🫡 체크인할 때마다 지급
  stakes: [10, 25, 50]
  buckets:
    - { id: on_time,   max: 4,           probability: 0.60 }
    - { id: d5,        min: 5,  max: 19, probability: 0.25 }
    - { id: d20,       min: 20, max: 59, probability: 0.10 }
    - { id: d60,       min: 60,          probability: 0.03 }
    - { id: cancelled, cancelled: true,  probability: 0.02 }
