  toast.offline: 📵 Funkloch 진입! 기록은 이 기기에 안전하게 저장 중…
  toast.online: 📶 다시 연결됐어요
  toast.copied: 결과를 클립보드에 복사했어요
  toast.share_failed: 공유하지 못했어요
