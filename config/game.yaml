# 게임 전역 규칙. 코드에 하드코딩하지 말고 여기서만 바꾼다.

# 지원 언어. 첫 항목이 기준(reference) 언어 — 다른 언어는 같은 키를 모두 가져야 한다.
# 기기 언어가 목록에 없으면 fallback 사용.
locales:
  supported: [ko, en, de]
  reference: ko
  fallback: en

# 카드 생성 알고리즘 버전. RNG/생성 순서/배치 규칙을 바꿔서 같은 날짜의 카드가
# 달라지게 되면 반드시 올린다 (과거 공유 카드와 불일치가 생기기 때문).
generator_version: 1

board:
  size: 5                     # 5×5
  free_square:
    id: free_rode_today
    term: Heute wieder Bahn gefahren
    emoji: "🫡"                # 문구는 locales/*.yaml 의 free_square

daily:
  timezone: Europe/Berlin     # 독일 기준 00시에 새 카드
  epoch: "2026-10-23"         # 이 날짜가 Zug-Bingo #1
  seed_prefix: "daily"

scoring:
  # 칸 점수 = round(등급 점수 × 배수)
  verify_multiplier:
    auto: 1.5                 # ✅ 실시간 데이터로 자동 인증
    self: 1.0                 # 🙋 셀프 신고
  free_square_points: 0
  bonus:
    line: 50                  # 빙고 1줄마다
    blackout: 1000            # 25칸 전부
