  settings.language_auto: 자동 (기기 언어)
  settings.haptics: 진동 피드백
  settings.on: 켜짐
  settings.off: 꺼짐
  help.title: 플레이 방법
  help.tap: 겪은 일을 탭해서 체크하세요. 체크한 칸을 다시 탭하면 자세히 볼 수 있어요.
  help.hold: 길게 누르면 칸 설명과 점수를 볼 수 있어요.
  help.lines: 가로·세로·대각선 한 줄을 채우면 빙고! 가운데 🫡 칸은 무료예요.
  help.blessed: 금색 테두리 줄은 🫡 축복 라인 — 일반 칸만 있어 오늘 가장 노려볼 만해요.
  help.rarity: 희귀한 칸일수록 점수가 높아요. 정시 도착은 무려 신화 등급.
  help.offline: 오프라인에서도 체크는 계속 저장돼요.
  help.daily: 독일 시간 자정마다 모두에게 같은 새 카드가 나와요.
  share.lines_zero: 빙고 도전 중
  share.lines_one: '{n}줄!'
  share.lines_other: '{n}줄!'
  share.blackout: 블랙아웃!
  share.footer: '{checked}칸 체크 · {score}점'
